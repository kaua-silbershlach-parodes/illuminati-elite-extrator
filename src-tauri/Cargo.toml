[package]
name = "illuminati-elite-extractor"
version = "1.0.0"
description = "Illuminati Elite Extractor: archive extractor for ZIP, 7Z, RAR, TAR and compressed files with signed GitHub auto-updates, by A Elite Estrangeira."
edition = "2021"

[lib]
name = "illuminati_elite_extractor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri-plugin-log = "2"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd", "xz", "deflate64"] }
sevenz-rust = "0.6"
unrar = "0.5"
tar = "0.4"
flate2 = "1"
bzip2 = "0.4"
xz2 = "0.1"
zstd = "0.13"
sha2 = "0.10"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"

[profile.release]
lto = true
codegen-units = 1

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Illuminati Elite Extractor</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="brand">
      <img src="icon.png" alt="" class="brand-icon">
      <div>
        <h1>Illuminati Elite Extractor</h1>
        <p class="subtitle">A Elite Estrangeira archive extractor &middot; <span id="version">v&hellip;</span></p>
      </div>
    </header>

    <section class="card">
      <h2>Extractor</h2>
      <p class="hint">Supports ZIP, 7Z, RAR, TAR, TAR.GZ, TAR.BZ2, TAR.XZ, TAR.ZST, GZ, BZ2, XZ and ZST. Entries are checked before extraction so unsafe paths are blocked.</p>
      <div class="actions">
        <input id="archive-path" type="text" placeholder="Archive path" style="flex:1; min-width:220px;">
        <button id="btn-browse">Browse</button>
      </div>
      <div class="actions">
        <button id="btn-list">List contents</button>
        <button id="btn-extract-here">Extract here</button>
        <button id="btn-extract-folder">Extract to folder</button>
        <button id="btn-context">Register context menu</button>
      </div>
      <pre id="extract-log" class="log"></pre>
    </section>

    <section class="card">
      <h2>Updates</h2>
      <p class="state">State: <strong id="upd-state">idle</strong></p>
      <div class="progress"><div id="upd-bar"></div></div>
      <div class="actions">
        <button id="btn-check">Check for updates</button>
        <button id="btn-download" disabled>Download and install</button>
        <button id="btn-restart" class="hidden">Restart to update</button>
      </div>
      <pre id="upd-log" class="log"></pre>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
